[package]
name = "vidcord"
version = "6.3.0"
description = "Compress videos for Discord"
authors = ["cyroz1"]
edition = "2021"

[lib]
name = "vidcord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vidcord"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
semver = "1"
url = "2"
regex-lite = "0.1"
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding is never observed by user code (no catch_unwind), and aborting on
# panic trims ~1-3% off the binary and removes landing-pad codegen across every
# crate we compile.
panic = "abort"

# Faster profile for CI branch/PR builds — skips LTO and uses parallel codegen.
# Tagged release builds still use [profile.release] above.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 4
opt-level = 1
strip = false

# Build third-party dependencies with a light optimization level even in dev
# builds. Our own crate stays unoptimized (fast incremental compiles), but
# encoding/regex hot paths in ffmpeg.rs execute against optimized dep code,
# which keeps `tauri dev` previews responsive.
[profile.dev.package."*"]
opt-level = 1
