name: Site Checks

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-assets.mjs"
      - "scripts/check-sitemap.mjs"
      - "scripts/check-site-structured-data.mjs"
      - "scripts/check-version.mjs"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-assets.mjs"
      - "scripts/check-sitemap.mjs"
      - "scripts/check-site-structured-data.mjs"
      - "scripts/check-version.mjs"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Site checks only need Prettier from the frontend dependency tree. Resolve
      # its exact locked version and integrity instead of installing every
      # app/build package.
      - name: Resolve locked tool versions
        id: tools
        run: |
          node -p '"prettier=" + require("./package-lock.json").packages["node_modules/prettier"].version' >> "$GITHUB_OUTPUT"
          node -p '"prettier_integrity=" + require("./package-lock.json").packages["node_modules/prettier"].integrity' >> "$GITHUB_OUTPUT"

      - name: Validate site
        env:
          PRETTIER_VERSION: ${{ steps.tools.outputs.prettier }}
          PRETTIER_INTEGRITY: ${{ steps.tools.outputs.prettier_integrity }}
        run: |
          test "$(npm view "prettier@$PRETTIER_VERSION" dist.integrity)" = "$PRETTIER_INTEGRITY"
          npm exec --yes --package "prettier@$PRETTIER_VERSION" -- npm run site:check
