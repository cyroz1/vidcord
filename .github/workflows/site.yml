name: Site Checks

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/main.tsx"
      - "src/web/**"
      - "src/index.css"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-assets.mjs"
      - "scripts/build-web-site.mjs"
      - "scripts/check-sitemap.mjs"
      - "scripts/check-site-structured-data.mjs"
      - "scripts/check-version.mjs"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "src/main.tsx"
      - "src/web/**"
      - "src/index.css"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-assets.mjs"
      - "scripts/build-web-site.mjs"
      - "scripts/check-sitemap.mjs"
      - "scripts/check-site-structured-data.mjs"
      - "scripts/check-version.mjs"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false

      - name: Build browser bundle
        run: npm run web:build

      - name: Check browser bundle is current
        run: git diff --exit-code -- site

      - name: Validate site
        run: npm run site:check
