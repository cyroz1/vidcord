name: Apply Vidcord feature changes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply and verify customizations
        run: node apply-vidcord-customizations.mjs .

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Format changed source
        run: |
          npm exec -- prettier --write src/App.tsx src/App.css src/hooks/useSettings.ts src/ipc.ts
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check whitespace
        run: git diff --check

      - name: Remove temporary helper files
        run: |
          rm -f apply-vidcord-customizations.mjs
          rm -f .github/workflows/apply-customizations.yml

      - name: Commit source changes to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes were produced."
            exit 0
          fi

          git commit -m "Add configurable output folder and completion actions"
          git push origin HEAD:${GITHUB_REF_NAME}
