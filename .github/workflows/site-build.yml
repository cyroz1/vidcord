name: Site Browser Build

on:
  push:
    branches: [main, "[0-9]+.[0-9]+"]
    paths:
      # The browser build shares helpers and components with the desktop app,
      # and the shared entry also bundles the lazy desktop application.
      - "src/**"
      - "index.html"
      - "public/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-web-site.mjs"
      - "scripts/check-site-generated.mjs"
      - "site/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, "[0-9]+.[0-9]+"]
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-web-site.mjs"
      - "scripts/check-site-generated.mjs"
      - "site/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated-browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false

      - name: Build browser bundle
        run: npm run web:build

      - name: Check browser bundle is current
        env:
          # Parity is a hard gate on main and on PRs targeting main. On
          # version branches (X.Y) src iterates faster than site/ is
          # regenerated, so there the check still runs and reports, but a
          # stale bundle does not fail the run.
          PARITY_BLOCKING: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: |
          status=0
          git diff --exit-code -- site ':(exclude)site/assets/ffmpeg-core-*.wasm.gz' || status=1
          node scripts/check-site-generated.mjs || status=1
          if [ "$status" -ne 0 ]; then
            if [ "$PARITY_BLOCKING" = "true" ]; then
              echo "::error::Committed site/ output is stale; regenerate it with npm run web:build."
              exit 1
            fi
            {
              echo "### Site parity check: stale bundle (non-blocking on this branch)"
              echo ""
              echo "The committed \`site/\` output does not match a fresh \`npm run web:build\`."
              echo "Expected while iterating on a version branch; parity is enforced on main and on PRs targeting main."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Committed site/ output is stale (non-blocking on version branches)."
          fi
