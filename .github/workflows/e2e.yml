name: End-to-End UI Tests

on:
  push:
    branches: [main, "[0-9]+.[0-9]+"]
    paths:
      # E2E only: app source, the specs, and the runners. Docs, site-only,
      # and repo-metadata pushes skip the 3 full Tauri builds.
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "public/**"
      - "e2e/**"
      - "scripts/e2e/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main, "[0-9]+.[0-9]+"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "public/**"
      - "e2e/**"
      - "scripts/e2e/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  browser-demo:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VIDCORD_E2E_ARTIFACTS: artifacts/e2e-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38d
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Browser files can be cached, but Linux system dependencies belong to
      # the fresh runner and need to be installed on every run.
      - name: Install Playwright Chromium and browser deps
        run: npx playwright install --with-deps chromium

      - name: Run browser demo end-to-end tests
        run: npm run e2e:web

      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-e2e-${{ github.run_attempt }}
          path: artifacts/e2e-web/
          if-no-files-found: ignore
          retention-days: 7

  desktop-app:
    name: Desktop UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Desktop e2e builds a full Tauri app per OS; bound well below the
    # 6-hour runner default so a hang fails fast instead of burning minutes.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers the shipped Linux ARM64 AppImage, which
        # previously had no end-to-end coverage.
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      VIDCORD_E2E_ARTIFACTS: artifacts/e2e-desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38d
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install Tauri and desktop test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev \
            patchelf xdg-utils ffmpeg xvfb \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $candidate = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            if ($candidate) {
              $candidate.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              "FFMPEG_PATH=$($candidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $env:Path = "$($candidate.DirectoryName);$env:Path"
            }
          }
          ffmpeg -version

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build and run desktop end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e:desktop

      - name: Build and run desktop end-to-end tests (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run e2e:desktop

      - name: Upload desktop test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-e2e-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/e2e-desktop/
          if-no-files-found: ignore
          retention-days: 7
