name: Multi-Platform Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Install FFmpeg for Windows
        run: |
          curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          powershell -Command "Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp"
          Get-ChildItem -Path ffmpeg_temp -Filter ffmpeg.exe -Recurse | Move-Item -Destination .
          Get-ChildItem -Path ffmpeg_temp -Filter ffprobe.exe -Recurse | Move-Item -Destination .
          
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm platforms/windows/vidcord.spec
        
      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: platforms/windows/script.iss
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidcord-windows
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm platforms/linux/vidcord_linux.spec
        
      - name: Build AppImage
        run: |
          chmod +x platforms/linux/appimagetool-x86_64.AppImage
          chmod +x platforms/linux/build_appimage.sh
          ./platforms/linux/build_appimage.sh
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidcord-linux
          path: dist/*.appimage

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Install FFmpeg for macOS
        run: |
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip -o ffmpeg.zip
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip -o ffprobe.zip
          unzip ffmpeg.zip -d platforms/macos/
          unzip ffprobe.zip -d platforms/macos/
          chmod +x platforms/macos/ffmpeg platforms/macos/ffprobe
          
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm platforms/macos/vidcord_mac.spec
        
      - name: Create component package
        run: |
          chmod +x platforms/macos/build_pkg.sh
          ./platforms/macos/build_pkg.sh
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidcord-macos
          path: dist/*.pkg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.exe
            release-artifacts/*.appimage
            release-artifacts/*.pkg
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
