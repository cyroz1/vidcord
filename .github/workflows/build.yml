name: Multi-Platform Build

on:
  push:
    branches: [ main, master, rust ]
    tags:
      - 'v*'
      - '[0-9]*'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'screenshots/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'screenshots/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x86_64
            rust-target: x86_64-pc-windows-msvc
            artifact-name: vidcord-windows-x86_64
            artifact-glob: src-tauri/target/release/bundle/**/*.exe

          - platform: windows-latest
            arch: aarch64
            rust-target: aarch64-pc-windows-msvc
            artifact-name: vidcord-windows-aarch64
            artifact-glob: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.exe

          - platform: ubuntu-22.04
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: vidcord-linux-x86_64
            artifact-glob: src-tauri/target/release/bundle/**/*.AppImage

          - platform: ubuntu-24.04-arm
            arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
            artifact-name: vidcord-linux-aarch64
            artifact-glob: src-tauri/target/release/bundle/**/*.AppImage

          - platform: macos-latest
            arch: universal
            rust-target: aarch64-apple-darwin,x86_64-apple-darwin
            artifact-name: vidcord-macos
            artifact-glob: src-tauri/target/release/bundle/pkg/*.pkg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg \
            xdg-utils

      - name: Cache FFmpeg (Windows x86_64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x86_64'
        uses: actions/cache@v4
        id: cache-ffmpeg-win-x64
        with:
          path: |
            C:\Windows\System32\ffmpeg.exe
            C:\Windows\System32\ffprobe.exe
          key: ffmpeg-windows-x86_64-v1

      - name: Install FFmpeg (Windows x86_64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x86_64' && steps.cache-ffmpeg-win-x64.outputs.cache-hit != 'true'
        run: |
          curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256 -o ffmpeg.zip.sha256
          $expected = (Get-Content ffmpeg.zip.sha256 -Raw).Trim().ToLower()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { Write-Error "FFmpeg checksum mismatch: expected $expected, got $actual"; exit 1 }
          powershell -Command "Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp"
          Get-ChildItem -Path ffmpeg_temp -Filter ffmpeg.exe -Recurse | Move-Item -Destination "$env:SystemRoot\System32"
          Get-ChildItem -Path ffmpeg_temp -Filter ffprobe.exe -Recurse | Move-Item -Destination "$env:SystemRoot\System32"

      - name: Cache FFmpeg (Windows aarch64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'aarch64'
        uses: actions/cache@v4
        id: cache-ffmpeg-win-arm
        with:
          path: |
            C:\Windows\System32\ffmpeg.exe
            C:\Windows\System32\ffprobe.exe
          key: ffmpeg-windows-aarch64-v1

      - name: Install FFmpeg (Windows aarch64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'aarch64' && steps.cache-ffmpeg-win-arm.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/tordona/ffmpeg-win-arm64/releases/download/8.0.1/ffmpeg-8.0.1-essentials-static-win-arm64.7z -o ffmpeg.7z
          7z x ffmpeg.7z -offmpeg_temp
          Get-ChildItem -Path ffmpeg_temp -Filter ffmpeg.exe -Recurse | Move-Item -Destination "$env:SystemRoot\System32"
          Get-ChildItem -Path ffmpeg_temp -Filter ffprobe.exe -Recurse | Move-Item -Destination "$env:SystemRoot\System32"

      - name: Install FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}


      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-always: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Build macOS PKG installer
        if: matrix.platform == 'macos-latest'
        run: bash platforms/macos/build_pkg.sh

      - name: Build (Windows aarch64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'aarch64'
        run: npx tauri build --target aarch64-pc-windows-msvc

      - name: Build (all other platforms)
        if: "!(matrix.platform == 'macos-latest') && !(matrix.platform == 'windows-latest' && matrix.arch == 'aarch64')"
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
