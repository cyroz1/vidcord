name: Multi-Platform Build

# Default to read-only; jobs that attest or publish declare their own
# additional grants.
permissions:
  contents: read

on:
  push:
    # NOTE: the "+" here is a one-or-more quantifier in GitHub's filter
    # matching (verified: pushes to 7.7 trigger this workflow), not a
    # literal plus. It matches exactly X.Y version branches.
    branches: [main, "[0-9]+.[0-9]+"]
    tags:
      - "v*"
    paths:
      # App and packaging source: platform builds run when these files change.
      # Docs and site-only pushes skip the build.
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.js"
      - "scripts/check-version.mjs"
      - "scripts/check-assets.mjs"
      - "scripts/check-bundle-size.mjs"
      - "scripts/check-build-tools.mjs"
      - "scripts/check-video-extensions.mjs"
      - "scripts/prune-desktop-dist.mjs"
      - "scripts/publish-linux-repositories.sh"
      - "scripts/render-arch-package.mjs"
      - "packaging/**"
      - "tools/tauri-cli/**"
      - ".github/workflows/**"
  pull_request:
    # Same "+" quantifier semantics as the push filter above.
    branches: [main, "[0-9]+.[0-9]+"]
    paths:
      # Same app and packaging source filter as push. Docs and site-only PRs
      # do not need a full platform build.
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.js"
      - "scripts/check-version.mjs"
      - "scripts/check-assets.mjs"
      - "scripts/check-bundle-size.mjs"
      - "scripts/check-build-tools.mjs"
      - "scripts/check-video-extensions.mjs"
      - "scripts/prune-desktop-dist.mjs"
      - "scripts/publish-linux-repositories.sh"
      - "scripts/render-arch-package.mjs"
      - "packaging/**"
      - "tools/tauri-cli/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  # A branch push and its pull-request synchronization carry the same head SHA.
  # Group them together so only one verification run survives. Release tags and
  # explicit packaging runs stay isolated and must finish.
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.ref || github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  # Lint, type-check, audit and build the frontend once, reuse the dist/ output
  # across all matrix jobs. This avoids running Vite 5× (once per platform) and
  # surfaces TypeScript / lint errors before any Rust compilation starts.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Check version alignment
        run: npm run version:check

      - name: Check asset organization
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check frontend bundle budget
        run: npm run bundle:check

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Run every Rust quality gate in one job to avoid another runner startup.
  # Clippy and tests use the same profile as non-release builds so the gated
  # Linux x86_64 build can reuse compatible dependency artifacts.
  rust-compile-checks:
    # Match the Linux x86_64 bundle runner so both apt and Rust caches are
    # distro-compatible and reusable by the gated build job.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          packages=(libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils)
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 &&
              sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends -o Acquire::Retries=3 "${packages[@]}"; then
              pkg-config --exists gdk-3.0
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "APT installation failed; refreshing package lists and retrying ($attempt/3)."
            sleep 5
          done

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Rustfmt check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-audit
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none

      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: src-tauri

      # Report-only (mirrors `npm run duplicates:report`): cargo audit above
      # is the gate for advisories; this just keeps duplicate crate majors
      # visible in the job log so new ones are a conscious decision.
      - name: Report duplicate Rust dependencies
        run: cargo tree --duplicates --manifest-path src-tauri/Cargo.toml
        continue-on-error: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          # rust-cache does not distinguish Ubuntu releases. Keep the shared
          # lint/build cache isolated from artifacts produced on ubuntu-latest.
          shared-key: rust-linux-ubuntu-22.04-v1

      - name: Clippy
        run: cargo clippy --locked --target x86_64-unknown-linux-gnu --profile ci --manifest-path src-tauri/Cargo.toml --tests -- -D warnings

      - name: Rust tests
        run: cargo test --locked --target x86_64-unknown-linux-gnu --profile ci --manifest-path src-tauri/Cargo.toml

  build:
    # Gate the expensive cross-platform build matrix on the frontend artifact
    # plus the Rust quality jobs so known-bad revisions fail before fan-out.
    # Linux x86_64 still reuses the `rust-linux` registry/source cache and
    # any compatible artifacts populated by rust-compile-checks.
    needs: [frontend, rust-compile-checks]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x86_64
            rust-target: x86_64-pc-windows-msvc
            tauri-target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact-name: vidcord-windows-x86_64

          - platform: windows-latest
            arch: aarch64
            rust-target: aarch64-pc-windows-msvc
            tauri-target: aarch64-pc-windows-msvc
            bundle: nsis
            artifact-name: vidcord-windows-aarch64

          - platform: ubuntu-22.04
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
            tauri-target: x86_64-unknown-linux-gnu
            bundle: appimage,deb,rpm
            artifact-name: vidcord-linux-x86_64

          - platform: ubuntu-22.04-arm
            arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
            tauri-target: aarch64-unknown-linux-gnu
            bundle: appimage,deb,rpm
            artifact-name: vidcord-linux-aarch64

          - platform: macos-latest
            arch: universal
            rust-target: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-target: universal-apple-darwin
            bundle: dmg
            artifact-name: vidcord-macos

    runs-on: ${{ matrix.platform }}
    # Full Tauri builds are the slowest jobs here; bound them well below the
    # 6-hour runner default so a hang fails fast instead of burning minutes.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Download frontend dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: frontend-dist
          path: dist/

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # Tauri bundles the installed GStreamer runtime/plugins into Linux
          # AppImages for WebKitGTK HTML video playback.
          packages=(
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libappindicator3-dev
            librsvg2-dev
            patchelf
            rpm
            xdg-utils
            gstreamer1.0-plugins-base
            gstreamer1.0-plugins-good
            gstreamer1.0-plugins-bad
            gstreamer1.0-libav
          )
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 &&
              sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends -o Acquire::Retries=3 "${packages[@]}"; then
              pkg-config --exists gdk-3.0
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "APT installation failed; refreshing package lists and retrying ($attempt/3)."
            sleep 5
          done

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: tools/tauri-cli/package-lock.json

      - name: Install the locked Tauri CLI
        run: npm ci --prefix tools/tauri-cli --prefer-offline --no-audit --fund=false

      - name: Verify locked Tauri build tool
        run: npm run build-tools:check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust dependencies (Linux x86_64, shared with rust-compile-checks)
        if: matrix.rust-target == 'x86_64-unknown-linux-gnu'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          shared-key: rust-linux-ubuntu-22.04-v1

      # Windows target artifacts are not interchangeable. Keep target-specific
      # keys so each architecture reuses its own prior builds without cache
      # contamination or two jobs racing to publish the same entry.
      - name: Cache Rust dependencies (Windows)
        if: startsWith(matrix.platform, 'windows-latest')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          shared-key: rust-windows-${{ matrix.rust-target }}

      # The ARM Linux package runner is Ubuntu 22.04 while ARM E2E uses Ubuntu
      # 24.04. Include the runner and target so glibc-bound artifacts stay
      # isolated across distributions.
      - name: Cache Rust dependencies
        if: matrix.rust-target != 'x86_64-unknown-linux-gnu' && !startsWith(matrix.platform, 'windows-latest')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          shared-key: rust-${{ matrix.platform }}-${{ matrix.rust-target }}-v1

      - name: Set AppImage update information (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # Lets linuxdeploy embed update info and emit a .zsync file so
          # AppImageUpdate-style delta updates can find new releases.
          arch_name="${{ matrix.arch == 'x86_64' && 'amd64' || 'aarch64' }}"
          echo "UPDATE_INFORMATION=gh-releases-zsync|cyroz1|vidcord|latest|vidcord_*_${arch_name}.AppImage.zsync" >> "$GITHUB_ENV"

      - name: Build installer
        run: npm run tauri:ci -- build --target ${{ matrix.tauri-target }} --bundles ${{ matrix.bundle }} --config '{"build":{"beforeBuildCommand":""}}' -- --locked --profile ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'ci' }}

      - name: Stage artifacts (Unix)
        if: ${{ matrix.platform != 'windows-latest' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find src-tauri/target \( -name "*.AppImage" -o -name "*.AppImage.zsync" -o -name "*.dmg" \) -exec cp {} artifacts/ \;

          if [[ "${{ matrix.platform }}" == ubuntu-* ]]; then
            version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
            arch="${{ matrix.arch }}"
            deb_arch="${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}"
            mapfile -t debs < <(find src-tauri/target -path '*/bundle/deb/*.deb' -type f)
            mapfile -t rpms < <(find src-tauri/target -path '*/bundle/rpm/*.rpm' -type f)
            if [[ "${#debs[@]}" -ne 1 || "${#rpms[@]}" -ne 1 ]]; then
              echo "expected one deb and one rpm, found ${#debs[@]} deb and ${#rpms[@]} rpm packages" >&2
              exit 1
            fi
            cp "${debs[0]}" "artifacts/vidcord_${version}_${deb_arch}.deb"
            cp "${rpms[0]}" "artifacts/vidcord_${version}_${arch}.rpm"
          fi

      - name: Stage artifacts (Windows)
        if: ${{ matrix.platform == 'windows-latest' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          # Single-quoted: backslash is literal in PowerShell wildcards, so
          # this matches executables directly inside the ...\bundle\nsis
          # output directory. (No trailing backslash: DirectoryName never
          # ends with a separator.)
          Get-ChildItem -Path src-tauri\target -Recurse -Filter *.exe |
            Where-Object { $_.DirectoryName -like '*\bundle\nsis' } |
            ForEach-Object { Copy-Item $_.FullName -Destination artifacts\ }

      - name: Normalize AppImage payload permissions (Linux)
        if: ${{ startsWith(matrix.platform, 'ubuntu') }}
        run: |
          set -euo pipefail
          # tauri-bundler/linuxdeploy bake restrictive modes (e.g. 770 on
          # AppRun.wrapped, 750 on directories) into the AppImage payload, so
          # anyone but the build user gets "Permission denied" on launch.
          # Extract the payload, normalize to world-readable/executable, and
          # repack with appimagetool so the shipped AppImage works for everyone.
          arch_name="${{ matrix.arch == 'x86_64' && 'amd64' || 'aarch64' }}"
          tool_arch="${{ matrix.arch == 'x86_64' && 'x86_64' || 'aarch64' }}"

          # Pinned appimagetool 1.9.1 with SHA-256 verification. The rolling
          # "continuous" build is a supply-chain risk for a tool that repacks
          # the shipped AppImage, so never go back to unpinned continuous.
          declare -A appimagetool_sha256=(
            [x86_64]=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            [aarch64]=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
          )

          mapfile -t appimages < <(compgen -G "artifacts/vidcord_*_${arch_name}.AppImage" || true)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi
          appimage="${appimages[0]}"
          asset_name="$(basename "$appimage")"
          appimage_abs="$(realpath "$appimage")"
          chmod +x "$appimage_abs"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"

          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${tool_arch}.AppImage"
          echo "${appimagetool_sha256[$tool_arch]}  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage

          "$appimage_abs" --appimage-extract >/dev/null
          chmod -R a+rX squashfs-root

          ./appimagetool.AppImage --appimage-extract-and-run squashfs-root \
            --updateinformation "gh-releases-zsync|cyroz1|vidcord|latest|vidcord_*_${arch_name}.AppImage.zsync" \
            "$asset_name" >/dev/null

          # Replace the staged AppImage and its zsync delta file with the repacked ones.
          mv -f "$asset_name" "$appimage_abs"
          mv -f "${asset_name}.zsync" "$(dirname "$appimage_abs")/"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/
          if-no-files-found: error
          # AppImage, DMG and NSIS outputs are already compressed. Avoid a
          # second CPU-heavy compression pass and bound transient CI storage.
          compression-level: 0
          retention-days: 7

  # Keep OIDC and attestation permissions out of jobs that execute PR-controlled
  # source and build scripts. This job only downloads the completed artifacts
  # and attests their digests on trusted tag/manual runs.
  attest-platform-builds:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: vidcord-*
          path: release-artifacts
          merge-multiple: true

      - name: Attest built installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-artifacts/*

  arch-package-build:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x86_64
            deb_arch: amd64
            # Pinned by digest (Docker Hub, 2026-10-24) so a mutable tag
            # cannot swap the toolchain that builds shipped packages.
            image: archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
          - platform: ubuntu-22.04-arm
            arch: aarch64
            deb_arch: arm64
            image: menci/archlinuxarm:base-devel@sha256:0a4663459ee538d31c7f2fc496f32dfc3f87d1c134141ecded15f2e1d04b00ce
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Download Linux package artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: vidcord-linux-*
          path: release-assets
          merge-multiple: true

      - name: Build pacman package
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          release_tag="${GITHUB_REF_NAME#v}"
          arch_input="$RUNNER_TEMP/vidcord-arch-package-input"
          arch_output="$RUNNER_TEMP/vidcord-arch-package-output"
          mkdir -p "$arch_input" "$arch_output"
          node scripts/render-arch-package.mjs "$version" "$release_tag" release-assets "$arch_input"
          cp "release-assets/vidcord_${version}_${{ matrix.deb_arch }}.deb" "$arch_input/"
          sed -i \
            -e "s@::https://github.com/cyroz1/vidcord/releases/download/v${release_tag}/vidcord_\${pkgver}_${{ matrix.deb_arch }}.deb@@" \
            "$arch_input/PKGBUILD"
          # The rendered .SRCINFO carries the expanded version instead of
          # the ${pkgver} template form, so it needs its own pattern.
          sed -i \
            -e "s@::https://github.com/cyroz1/vidcord/releases/download/v${release_tag}/vidcord_${version}_${{ matrix.deb_arch }}.deb@@" \
            "$arch_input/.SRCINFO"
          docker run --rm \
            --mount "type=bind,source=$arch_input,target=/inputs,readonly" \
            --mount "type=bind,source=$arch_output,target=/output" \
            ${{ matrix.image }} \
            bash -lc 'set -e; command -v makepkg >/dev/null; id -u build >/dev/null 2>&1 || useradd --create-home build; mkdir -p /tmp/vidcord-build; cp -a /inputs/. /tmp/vidcord-build/; chown -R build:build /tmp/vidcord-build; su build -c "cd /tmp/vidcord-build && makepkg --noconfirm --clean --nodeps"; cp /tmp/vidcord-build/vidcord-bin-*.pkg.tar.zst /output/'
          mapfile -t built_packages < <(find "$arch_output" -maxdepth 1 -type f -name 'vidcord-bin-*.pkg.tar.zst' -print)
          expected_package="vidcord-bin-${version}-1-${{ matrix.arch }}.pkg.tar.zst"
          if [[ "${#built_packages[@]}" -ne 1 || "$(basename "${built_packages[0]:-}")" != "$expected_package" ]]; then
            echo "Expected exactly $expected_package from the Arch builder." >&2
            exit 1
          fi
          mkdir -p artifacts
          cp -- "${built_packages[0]}" artifacts/

      - name: Attest pacman package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/*.pkg.tar.zst

      - name: Upload pacman package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vidcord-pacman-${{ matrix.arch }}
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign-release-artifacts:
    needs: [build, arch-package-build, attest-platform-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: release-artifacts
          merge-multiple: true
          pattern: vidcord-*

      - name: Verify build artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' artifact; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref "$GITHUB_REF"
          done < <(
            find release-artifacts -type f \( \
              -name '*.AppImage' -o -name '*.AppImage.zsync' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.dmg' -o -name '*.exe' \
            \) -print0
          )

      - name: Sign verified installers
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.VIDCORD_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > release-signing-key.pem
          trap 'rm -f release-signing-key.pem' EXIT

          expected_public_key="$(tr -d '[:space:]' < src-tauri/update-signing-public-key.hex)"
          actual_public_key="$(openssl pkey -in release-signing-key.pem -pubout -outform DER | tail -c 32 | od -An -tx1 -v | tr -d ' \n')"
          test "$actual_public_key" = "$expected_public_key"

          # A missing platform artifact must fail here, not ship as a
          # silent partial release.
          for pair in 'exe 2' 'dmg 1' 'AppImage 2' 'AppImage.zsync 2' 'deb 2' 'rpm 2' 'pkg.tar.zst 2'; do
            set -- $pair
            count="$(find release-artifacts -type f -name "*.$1" | wc -l)"
            if [ "$count" -ne "$2" ]; then
              echo "expected $2 *.$1 release artifacts, found $count" >&2
              exit 1
            fi
          done
          while IFS= read -r -d '' artifact; do
            asset_name="$(basename "$artifact")"
            digest="$(sha256sum "$artifact" | cut -d ' ' -f1)"
            printf 'vidcord-update-signature-v1\n%s\n%s\n%s\n' \
              "$RELEASE_TAG" "$asset_name" "$digest" > "$artifact.message"
            openssl pkeyutl -sign -rawin -inkey release-signing-key.pem \
              -in "$artifact.message" -out "$artifact.sig"
            test "$(wc -c < "$artifact.sig")" -eq 64
            rm -f "$artifact.message"
          done < <(
            find release-artifacts -type f \( \
              -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.dmg' -o -name '*.exe' \
            \) -print0
          )

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-release-artifacts
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: sign-release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Download signed release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: signed-release-artifacts
          path: release-artifacts

      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk -v tag="## $TAG" 'found && /^## /{exit} $0==tag{found=1;next} found' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md has no non-empty ## $TAG release section" >&2
            exit 1
          fi

      - name: Create release
        # v3.0.0, pinned because this job has contents:write.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: release-artifacts/**/*
          # Publish immediately so the in-app updater sees the release.
          # Drafts are invisible to the update check until manually published.
          draft: false
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-linux-package-repositories:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Check repository signing key
        id: repository-key
        env:
          REPOSITORY_GPG_KEY: ${{ secrets.VIDCORD_REPOSITORY_GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "$REPOSITORY_GPG_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Package artifacts were published, but Linux repositories were not updated." >> "$GITHUB_STEP_SUMMARY"
            echo "Add VIDCORD_REPOSITORY_GPG_PRIVATE_KEY and enable GitHub Pages for the linux-packages branch." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download signed release packages
        if: steps.repository-key.outputs.configured == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: signed-release-artifacts
          path: release-artifacts

      - name: Install repository tools
        if: steps.repository-key.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            apt-utils createrepo-c dpkg-dev gnupg

      - name: Generate signed Linux repositories
        if: steps.repository-key.outputs.configured == 'true'
        env:
          VIDCORD_REPOSITORY_GPG_PRIVATE_KEY: ${{ secrets.VIDCORD_REPOSITORY_GPG_PRIVATE_KEY }}
          VIDCORD_REPOSITORY_GPG_PASSPHRASE: ${{ secrets.VIDCORD_REPOSITORY_GPG_PASSPHRASE }}
          VIDCORD_REPOSITORY_BASE_URL: https://cyroz1.github.io/vidcord
        run: bash scripts/publish-linux-repositories.sh release-artifacts "$RUNNER_TEMP/linux-repositories"

      - name: Publish repositories to the linux-packages branch
        if: steps.repository-key.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pages_branch="$RUNNER_TEMP/linux-packages"
          git init --initial-branch=linux-packages "$pages_branch"
          cd "$pages_branch"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code origin refs/heads/linux-packages >/dev/null 2>&1; then
            git fetch --depth=1 origin linux-packages
            git reset --hard FETCH_HEAD
          fi
          rm -rf apt rpm pacman vidcord-repo-key.asc vidcord-repo-key.fingerprint vidcord-repo-key.gpg
          cp -a "$RUNNER_TEMP/linux-repositories/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Package repository is already current."
            exit 0
          fi
          git commit -m "Publish Linux package repositories for ${GITHUB_REF_NAME}"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${authorization}" push origin linux-packages
