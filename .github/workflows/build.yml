name: Multi-Platform Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - '[0-9]*'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'screenshots/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'screenshots/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-windows:
    strategy:
      matrix:
        arch: [x86_64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Install FFmpeg for Windows (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          powershell -Command "Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp"
          Get-ChildItem -Path ffmpeg_temp -Filter ffmpeg.exe -Recurse | Move-Item -Destination .
          Get-ChildItem -Path ffmpeg_temp -Filter ffprobe.exe -Recurse | Move-Item -Destination .

      - name: Install FFmpeg for Windows (ARM64)
        if: matrix.arch == 'arm64'
        run: |
          curl -L https://github.com/tordona/ffmpeg-win-arm64/releases/download/8.0.1/ffmpeg-8.0.1-essentials-static-win-arm64.7z -o ffmpeg.7z
          7z x ffmpeg.7z -offmpeg_temp
          Get-ChildItem -Path ffmpeg_temp -Filter ffmpeg.exe -Recurse | Move-Item -Destination .
          Get-ChildItem -Path ffmpeg_temp -Filter ffprobe.exe -Recurse | Move-Item -Destination .
          
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm platforms/windows/vidcord.spec
        
      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          python -c "import build, os; v = build.get_version(); print(f'Extracted: {v}'); open(os.environ['GITHUB_OUTPUT'], 'a').write(f'VERSION={v}\n')"
          
      - name: Debug Version
        run: echo "VERSION=${{ steps.get_version.outputs.VERSION }}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Compile Inno Setup Installer
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.get_version.outputs.VERSION }} /DMyArch=${{ matrix.arch }} /DMyOutputBaseFilename=vidcord_v${{ steps.get_version.outputs.VERSION }}_${{ matrix.arch }}_setup platforms/windows/script.iss
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidcord-windows-${{ matrix.arch }}
          path: dist/*.exe

  build-linux:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm platforms/linux/vidcord_linux.spec
        
      - name: Build AppImage
        run: |
          chmod +x platforms/linux/appimagetool-x86_64.AppImage
          chmod +x platforms/linux/appimagetool-aarch64.AppImage
          chmod +x platforms/linux/build_appimage.sh
          ./platforms/linux/build_appimage.sh
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidcord-linux-${{ matrix.arch }}
          path: dist/*.appimage

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Install FFmpeg for macOS
        run: |
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip -o ffmpeg.zip
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip -o ffprobe.zip
          unzip ffmpeg.zip -d platforms/macos/
          unzip ffprobe.zip -d platforms/macos/
          chmod +x platforms/macos/ffmpeg platforms/macos/ffprobe
          
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm platforms/macos/vidcord_mac.spec
        
      - name: Create component package
        run: |
          chmod +x platforms/macos/build_pkg.sh
          ./platforms/macos/build_pkg.sh
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidcord-macos
          path: dist/*.pkg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.exe
            release-artifacts/*.appimage
            release-artifacts/*.pkg
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
