name: Multi-Platform Build

on:
  push:
    branches: [ main, master, rust ]
    tags:
      - 'v*'
      - '[0-9]*'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'screenshots/**'
  pull_request:
    branches: [ main, master, rust ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'screenshots/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, type-check, audit and build the frontend once, reuse the dist/ output
  # across all matrix jobs. This avoids running Vite 5× (once per platform) and
  # surfaces TypeScript / lint errors before any Rust compilation starts.
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  # Run Rust quality checks: clippy, tests, and dependency audit.
  # Runs on ubuntu-latest only — no need to repeat on all 5 platforms.
  rust-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Audit Rust dependencies
        run: cargo audit --manifest-path src-tauri/Cargo.toml

  build:
    needs: [frontend, rust-checks]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x86_64
            rust-target: x86_64-pc-windows-msvc
            artifact-name: vidcord-windows-x86_64
            artifact-glob: src-tauri/target/release/bundle/nsis/*.exe

          - platform: windows-latest
            arch: aarch64
            rust-target: aarch64-pc-windows-msvc
            artifact-name: vidcord-windows-aarch64
            artifact-glob: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

          - platform: ubuntu-22.04
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: vidcord-linux-x86_64
            artifact-glob: src-tauri/target/release/bundle/**/*.AppImage

          - platform: ubuntu-24.04-arm
            arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
            artifact-name: vidcord-linux-aarch64
            artifact-glob: src-tauri/target/release/bundle/**/*.AppImage

          - platform: macos-latest
            arch: universal
            rust-target: aarch64-apple-darwin,x86_64-apple-darwin
            artifact-name: vidcord-macos
            artifact-glob: src-tauri/target/release/bundle/pkg/*.pkg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist/

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg \
            xdg-utils

      - name: Cache FFmpeg (Windows x86_64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x86_64'
        uses: actions/cache@v5
        id: cache-ffmpeg-win-x64
        with:
          path: C:\tools\ffmpeg-x64
          key: ffmpeg-windows-x86_64-v1

      - name: Install FFmpeg (Windows x86_64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x86_64' && steps.cache-ffmpeg-win-x64.outputs.cache-hit != 'true'
        run: |
          curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256 -o ffmpeg.zip.sha256
          $expected = (Get-Content ffmpeg.zip.sha256 -Raw).Trim().ToLower()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { Write-Error "FFmpeg checksum mismatch: expected $expected, got $actual"; exit 1 }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $binDir = Get-ChildItem -Path ffmpeg_extract -Filter bin -Recurse -Directory | Select-Object -First 1 -ExpandProperty FullName
          New-Item -ItemType Directory -Force -Path C:\tools\ffmpeg-x64 | Out-Null
          Copy-Item "$binDir\ffmpeg.exe" C:\tools\ffmpeg-x64\
          Copy-Item "$binDir\ffprobe.exe" C:\tools\ffmpeg-x64\

      - name: Add FFmpeg to PATH (Windows x86_64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x86_64'
        run: echo "C:\tools\ffmpeg-x64" >> $env:GITHUB_PATH

      - name: Cache FFmpeg (Windows aarch64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'aarch64'
        uses: actions/cache@v5
        id: cache-ffmpeg-win-arm
        with:
          path: C:\tools\ffmpeg-arm64
          key: ffmpeg-windows-aarch64-v1

      - name: Install FFmpeg (Windows aarch64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'aarch64' && steps.cache-ffmpeg-win-arm.outputs.cache-hit != 'true'
        run: |
          # NOTE: No official ARM64 FFmpeg Windows build exists from gyan.dev or ffmpeg.org.
          # This uses a community build. A SHA256 checksum should be added here once a
          # stable, verifiable upstream source for ARM64 Windows FFmpeg is available.
          # Track: https://github.com/BtbN/FFmpeg-Builds for an official alternative.
          curl -L https://github.com/tordona/ffmpeg-win-arm64/releases/download/8.0.1/ffmpeg-8.0.1-essentials-static-win-arm64.7z -o ffmpeg.7z
          7z x ffmpeg.7z -offmpeg_extract
          $binDir = Get-ChildItem -Path ffmpeg_extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
          New-Item -ItemType Directory -Force -Path C:\tools\ffmpeg-arm64 | Out-Null
          Copy-Item "$binDir\ffmpeg.exe" C:\tools\ffmpeg-arm64\
          Copy-Item "$binDir\ffprobe.exe" C:\tools\ffmpeg-arm64\

      - name: Add FFmpeg to PATH (Windows aarch64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'aarch64'
        run: echo "C:\tools\ffmpeg-arm64" >> $env:GITHUB_PATH

      - name: Cache Homebrew packages (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/cache@v5
        id: cache-brew-ffmpeg
        with:
          path: |
            ~/Library/Caches/Homebrew/ffmpeg--*
            /usr/local/Cellar/ffmpeg
            /opt/homebrew/Cellar/ffmpeg
          key: brew-ffmpeg-${{ runner.arch }}-v1

      - name: Install FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Build (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: npx tauri build --target universal-apple-darwin --bundles app --config '{"build":{"beforeBuildCommand":""}}'

      - name: Build macOS PKG installer
        if: matrix.platform == 'macos-latest'
        run: bash platforms/macos/build_pkg.sh

      - name: Build (Windows aarch64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'aarch64'
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'

      - name: Build (Windows x86_64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x86_64'
        run: npx tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'

      - name: Build (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: npx tauri build --bundles appimage --config '{"build":{"beforeBuildCommand":""}}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
