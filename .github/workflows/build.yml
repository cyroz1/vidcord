name: Multi-Platform Build

on:
  push:
    branches: [ main, master, rust ]
    tags:
      - 'v*'
      - '[0-9]*'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'screenshots/**'
  pull_request:
    branches: [ main, master, rust ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'screenshots/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, type-check, audit and build the frontend once, reuse the dist/ output
  # across all matrix jobs. This avoids running Vite 5× (once per platform) and
  # surfaces TypeScript / lint errors before any Rust compilation starts.
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependencies
        if: github.event_name != 'pull_request'
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  # Run Rust quality checks: clippy, tests, and dependency audit.
  # Runs on ubuntu-latest only — no need to repeat on all 5 platforms.
  rust-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Rustfmt check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: src-tauri

  build:
    needs: [frontend, rust-checks]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x86_64
            rust-target: x86_64-pc-windows-msvc
            artifact-name: vidcord-windows-x86_64
            artifact-glob: src-tauri/target/release/bundle/nsis/*.exe

          - platform: windows-latest
            arch: aarch64
            rust-target: aarch64-pc-windows-msvc
            artifact-name: vidcord-windows-aarch64
            artifact-glob: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

          - platform: ubuntu-22.04
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: vidcord-linux-x86_64
            artifact-glob: src-tauri/target/release/bundle/**/*.AppImage

          - platform: ubuntu-24.04-arm
            arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
            artifact-name: vidcord-linux-aarch64
            artifact-glob: src-tauri/target/release/bundle/**/*.AppImage

          - platform: macos-latest
            arch: universal
            rust-target: aarch64-apple-darwin,x86_64-apple-darwin
            artifact-name: vidcord-macos
            artifact-glob: src-tauri/target/release/bundle/pkg/*.pkg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist/

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          version: 1.0



      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli

      - name: Build (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          PROFILE=${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'ci' }}
          npx tauri build --target universal-apple-darwin --bundles app --profile $PROFILE --config '{"build":{"beforeBuildCommand":""}}'

      - name: Build macOS PKG installer
        if: matrix.platform == 'macos-latest'
        run: bash platforms/macos/build_pkg.sh

      - name: Build (Windows aarch64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'aarch64'
        run: |
          $PROFILE = "${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'ci' }}"
          npx tauri build --target aarch64-pc-windows-msvc --bundles nsis --profile $PROFILE --config '{"build":{"beforeBuildCommand":""}}'

      - name: Build (Windows x86_64)
        if: matrix.platform == 'windows-latest' && matrix.arch == 'x86_64'
        run: |
          $PROFILE = "${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'ci' }}"
          npx tauri build --bundles nsis --profile $PROFILE --config '{"build":{"beforeBuildCommand":""}}'

      - name: Build (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          PROFILE=${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'ci' }}
          npx tauri build --bundles appimage --profile $PROFILE --config '{"build":{"beforeBuildCommand":""}}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
